const tut24=()=>`<p>${L('Pada format 24 jam, angka 13 sampai 24 dipakai untuk waktu setelah siang. Jarum jam tetap menunjuk angka 1 sampai 12, jadi kurangi 12. Contoh: 15.00 → 15 − 12 = 3, jadi jarum pendek di angka 3.','In the 24-hour format, the numbers 13 to 24 are used for times after noon. The clock hands still point to 1 to 12, so subtract 12. Example: 15:00 → 15 − 12 = 3, so the short hand points to 3.')}</p><div class="t24">${[...Array(12)].map((_,i)=>`<div>${t24(13+i,0)} = ${pe(13+i)}</div>`).join('')}</div>`;

function start(l){S.lvl=l;const k=S.m+l,prev=S.last[k]||[],qs=[],keys=new Set();S.pmI=shuf([0,1,2,3,4]).slice(0,2);let tr=0;while(qs.length<5&&tr++<400){const q=G[S.m](l,qs.length);if(keys.has(q.key)||(tr<300&&prev.includes(q.key)))continue;keys.add(q.key);qs.push(q)}S.last[k]=qs.map(q=>q.key);Object.assign(S,{qs,i:0,sc:0,locked:0,sel:null,hint:0,expl:0,fb:'',cl:rcl(qs[0])});go('quiz')}

<div class="qbox ${c}" style="margin-top:12px">${q.vis(false)}<div class="pr">${q.p}</div></div>${body}
${S.fb?`<p class="pr" role="status">${S.fb}</p>`:''}${S.hint?`<div class="hintbox">💡 ${q.hint}</div>`:''}${S.expl&&S.locked?`<div class="hintbox">📖 ${q.expl}</div>`:''}

function fin(ok,i){S.locked=1;S.okk=ok;S.sel=i;if(ok)S.sc++;sfx(ok?'ok':'no');const n=nm(),q=S.qs[S.i];S.fb=ok?pick([L(`Hebat, ${n}! 🎉`,`Great job, ${n}! 🎉`),L(`Benar sekali, ${n}!`,`That's right, ${n}!`),L(`Keren, ${n}! 🌟`,`Awesome, ${n}! 🌟`)]):pick([L(`Hampir, ${n}! Jawaban yang benar: ${q.ans}. Yuk lihat penjelasannya!`,`Almost, ${n}! The answer is ${q.ans}. Let's read why!`),L(`Tidak apa-apa, ${n}. Jawabannya ${q.ans}. Kamu pasti bisa!`,`It's okay, ${n}. The answer is ${q.ans}. You can do it!`)]);render()}

function initClock(){const s=$('#ck');let hand=0;const ang=e=>{const r=s.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;return{a:(Math.atan2(x,-y)*180/Math.PI+360)%360,d:Math.hypot(x,y)/(r.width/200)}};
s.onpointerdown=e=>{if(S.locked)return;s.setPointerCapture(e.pointerId);hand=ang(e).d<55?'h':'m';mv(e)};s.onpointermove=e=>{if(hand)mv(e)};s.onpointerup=()=>hand=0;
function mv(e){const a=ang(e).a;if(hand=='m')S.cl.m=Math.round(a/30)*5%60;else{let h=Math.round(((a-S.cl.m/2+360)%360)/30)%12;S.cl.h=h||12}upd(S.cl.h,S.cl.m)}}
function vTbl(){return `<h2>${mo().n()}</h2><p class="tag">${L('Semua jawaban sudah terlihat. Tidak ada soal di sini.','All answers are shown. No questions here.')}</p><div class="mt">${[...Array(10)].map((_,i)=>`<div><b>${L('Perkalian','Multiplication')} ${i+1}</b>${[...Array(10)].map((_,j)=>`${i+1} × ${j+1} = ${(i+1)*(j+1)}<br>`).join('')}</div>`).join('')}</div><p><button class="big g" onclick="back()">${L('Kembali ke menu','Back to menu')}</button></p>`}
function vDsel(){return `<h2>${mo().n()}</h2><p class="tag">${L('Pilih pembagi','Pick a divisor')}</p><div class="dv">${[...Array(20)].map((_,i)=>`<button class="b" onclick="go('dtbl',{d:${i+1}})">${L('Bagi','÷')} ${i+1}</button>`).join('')}</div>`}
function vDtbl(){return `<h2>${L('Bagi dengan','Divide by')} ${S.d}</h2><p class="tag">${L('Referensi: semua jawaban sudah terlihat.','Reference: all answers are shown.')}</p><div class="card">${[...Array(10)].map((_,k)=>`<div class="pr">${S.d*(k+1)} ÷ ${S.d} = ${k+1}</div>`).join('')}</div>`}
function vSet(){const sl=(k,v)=>`<div class="card"><b>${k=='bgm'?L('Musik latar (BGM)','Background music (BGM)'):L('Suara efek (SFX)','Sound effects (SFX)')}</b><div class="row"><button class="b ${S.st[k]?'sel':''}" onclick="tg('${k}',1)">ON</button><button class="b ${S.st[k]?'':'sel'}" onclick="tg('${k}',0)">OFF</button><label>${L('Volume','Volume')} <input type="range" min="0" max="1" step=".05" value="${S.st[v]}" oninput="S.st['${v}']=+this.value;vol();save()" aria-label="volume"></label></div></div>`;
return `<h2>⚙️ ${L('Pengaturan','Settings')}</h2><div class="card"><b>${L('Bahasa','Language')}</b><div class="row"><button class="b ${S.lang=='id'?'sel':''}" onclick=\"setLang('id')\">🇮🇩 Bahasa Indonesia</button><button class="b ${S.lang=='en'?'sel':''}" onclick=\"setLang('en')\">🇬🇧 English</button></div></div>${sl('bgm','bv')}${sl('sfx','sv')}<div class="card"><b>👤 ${nm()}</b><p><button class="b" onclick="logout()">↩ ${L('Keluar','Log out')}</button></p></div>`}
function tg(k,v){S.st[k]=v;save();if(k=='bgm'){v?bgmStart():bgmStop()}vol();if(k=='sfx'&&v)sfx('ok');render()}
function vAbout(){const id=S.lang=='id',P=id?[`Kemampuan matematika dasar penting bagi anak-anak karena dipakai di sekolah dan dalam kehidupan sehari-hari. Namun, masih banyak anak yang kesulitan dalam perhitungan dasar seperti penjumlahan, pengurangan, perkalian, dan pembagian. Karena itu, dibutuhkan cara belajar yang tepat dan menyenangkan untuk membantu anak meningkatkan kemampuan matematikanya.`,`Masalah umum yang pertama adalah kesulitan anak dalam matematika dasar. Banyak anak masih kesulitan menghitung hal-hal sederhana. Kemampuan ini dibutuhkan saat menghitung uang, membandingkan harga, atau menghitung uang kembalian. Jika kemampuan dasar ini belum dikuasai, matematika yang lebih sulit pun akan semakin sulit dipahami.`,`Masalah khususnya adalah banyak anak mudah bosan saat belajar matematika, dan sebagian belum lancar membaca. Karena itu, soal matematika yang berbentuk tulisan bisa sulit dipahami, dan perhatian mereka mudah hilang saat belajar.`,`Solusi umumnya adalah membuat belajar matematika lebih menyenangkan dan praktis. Permainan, gambar, benda, dan kegiatan sehari-hari dapat digunakan agar belajar lebih menarik. Misalnya, anak dapat berlatih pengurangan dengan menghitung sisa uang setelah membeli jajanan.`,`Solusi khususnya adalah mengembangkan aplikasi web edukasi bernama “Angka Kita.” Perhitungan dasar dapat dilatih melalui permainan, gambar, audio, dan situasi kehidupan nyata. Sesi latihan yang singkat juga disediakan agar anak tidak bosan. Tombol lewati dapat ditambahkan agar anak yang sudah paham suatu materi bisa langsung lanjut ke level berikutnya.`,`Masalah ini dijelaskan secara umum, termasuk anak-anak di Indonesia serta pentingnya kemampuan dasar matematika dan membaca.`]:[`Basic mathematics skills are important for children because they are used in school and everyday life. However, many children still struggle with basic calculations such as addition, subtraction, multiplication, and division. Therefore, suitable and enjoyable learning methods are needed to help children improve their mathematical skills.`,`The first general problem is children's difficulty with basic mathematics. Many children still struggle with simple calculations. These skills are needed when money is counted, prices are compared, or change is calculated. If these basic skills are not mastered, more difficult mathematics can also become harder to understand.`,`The specific problem is that many children get bored easily when mathematics is learned, and some are not fluent in reading. Therefore, written math questions can be difficult to understand, and their attention can be lost during learning.`,`The general solution is to make mathematics learning more fun and practical. Games, pictures, objects, and everyday activities can be used to make learning more interesting. For example, children can practice subtraction by calculating how much money is left after buying snacks.`,`The specific solution is to develop an educational web application called “Angka Kita.” Basic calculations can be practiced through games, pictures, audio, and real-life situations. Short practice sessions can also be provided so children do not get bored. A skip button can be added so children who already understand a topic can move to the next level.`,`The problem is explained generally, including children in Indonesia and the importance of basic math and reading skills.`];return `<div class="card about">${P.map(t=>`<p>${t}</p>`).join('')}<p>${id?'Kelompok 3, XI - 5':'Group 3, XI - 5'}<br>SMAN 30 Jakarta</p></div>`}
boot();
</script></body></html>
